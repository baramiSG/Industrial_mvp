<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" data-i18n-attr="content:app.description" />
  <title></title>
  <link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="app-loading" aria-busy="true">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/static/assets/logo.svg" alt="" data-i18n-attr="alt:brand.logo_alt" />
        <div>
          <strong data-i18n="brand.name"></strong>
          <span data-i18n="brand.tagline"></span>
        </div>
      </div>

      <nav class="nav" aria-label="" data-i18n-attr="aria-label:nav.primary_label">
        <button class="nav-item active" data-target="overview"><span>01</span><b data-i18n="nav.overview"></b></button>
        <button class="nav-item" data-target="workspace"><span>02</span><b data-i18n="nav.workspace"></b></button>
        <button class="nav-item" data-target="methodology"><span>03</span><b data-i18n="nav.methodology"></b></button>
        <button class="nav-item" data-target="extraction"><span>04</span><b data-i18n="nav.extraction"></b></button>
        <button class="nav-item" data-target="governance"><span>05</span><b data-i18n="nav.governance"></b></button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-dot"><i></i><span data-i18n="snapshot.status"></span></div>
        <small data-i18n="snapshot.as_of"></small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="topbar.eyebrow"></p>
          <h1 data-i18n="topbar.title"></h1>
        </div>
        <div class="topbar-actions">
          <div class="mode-control" role="group" aria-label="" data-i18n-attr="aria-label:mode.group_label">
            <button class="mode-button active" data-mode="public" data-i18n="mode.public"></button>
            <button class="mode-button" data-mode="simulated" data-i18n="mode.simulated"></button>
          </div>
          <button id="locale-switch" class="locale-button" data-locale-switch data-i18n="locale.switch" data-i18n-attr="aria-label:locale.switch_aria"></button>
        </div>
      </header>

      <section id="overview" class="page-section hero-section">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="overview.eyebrow"></p>
          <h2 data-i18n="overview.title"></h2>
          <p data-i18n="overview.body"></p>
          <div class="hero-actions">
            <button class="primary-button" id="open-first-case" data-i18n="overview.open_steel"></button>
            <button class="secondary-button" id="view-methodology" data-i18n="overview.inspect_rules"></button>
          </div>
        </div>
        <div class="decision-flow" aria-label="" data-i18n-attr="aria-label:flow.aria">
          <div class="flow-node"><span>01</span><b data-i18n="flow.signal"></b><small data-i18n="flow.signal_detail"></small></div>
          <div class="flow-line"></div>
          <div class="flow-node"><span>02</span><b data-i18n="flow.resolve"></b><small data-i18n="flow.resolve_detail"></small></div>
          <div class="flow-line"></div>
          <div class="flow-node"><span>03</span><b data-i18n="flow.test"></b><small data-i18n="flow.test_detail"></small></div>
          <div class="flow-line"></div>
          <div class="flow-node"><span>04</span><b data-i18n="flow.decide"></b><small data-i18n="flow.decide_detail"></small></div>
        </div>
      </section>

      <section class="page-section compact-section" aria-labelledby="portfolio-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="portfolio.eyebrow"></p>
            <h2 id="portfolio-title" data-i18n="portfolio.title"></h2>
          </div>
          <span class="snapshot-chip" data-i18n="portfolio.chip"></span>
        </div>
        <div id="kpi-grid" class="kpi-grid loading-block"></div>
        <div id="opportunity-grid" class="opportunity-grid loading-block"></div>
      </section>

      <section id="workspace" class="page-section workspace-section">
        <div class="section-heading workspace-heading">
          <div>
            <p class="eyebrow" data-i18n="workspace.eyebrow"></p>
            <h2 id="workspace-title" data-i18n="workspace.title"></h2>
          </div>
          <div class="workspace-tools">
            <label class="select-label" for="opportunity-select" data-i18n="workspace.opportunity"></label>
            <select id="opportunity-select" aria-label="" data-i18n-attr="aria-label:workspace.select_aria"></select>
          </div>
        </div>
        <div id="workspace-manifest" class="workspace-grid loading-block" role="region" aria-label="" data-i18n-attr="aria-label:workspace.region_aria">
          <div class="skeleton tall"></div>
          <div class="skeleton"></div>
        </div>
      </section>

      <section id="methodology" class="page-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="methodology.eyebrow"></p>
            <h2 data-i18n="methodology.title"></h2>
          </div>
          <span class="snapshot-chip" data-i18n="methodology.chip"></span>
        </div>
        <div id="methodology-summary" class="methodology-summary loading-block"></div>
      </section>

      <section id="extraction" class="page-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="extraction.eyebrow"></p>
            <h2 data-i18n="extraction.title"></h2>
          </div>
          <span id="extraction-score" class="snapshot-chip" data-i18n="extraction.loading"></span>
        </div>
        <div id="extraction-grid" class="extraction-grid loading-block"></div>
      </section>

      <section id="governance" class="page-section governance-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="governance.eyebrow"></p>
            <h2 data-i18n="governance.title"></h2>
          </div>
        </div>
        <div class="governance-grid">
          <article class="governance-card">
            <span class="governance-icon" aria-hidden="true"></span>
            <h3 data-i18n="governance.public_title"></h3>
            <p data-i18n="governance.public_body"></p>
            <ul><li data-i18n="governance.public_item1"></li><li data-i18n="governance.public_item2"></li><li data-i18n="governance.public_item3"></li></ul>
          </article>
          <article class="governance-card synthetic-card">
            <span class="governance-icon" aria-hidden="true"></span>
            <h3 data-i18n="governance.simulated_title"></h3>
            <p data-i18n="governance.simulated_body"></p>
            <div class="synthetic-labels" data-policy-labels="governance"></div>
            <ul><li data-i18n="governance.simulated_item1"></li><li data-i18n="governance.simulated_item2"></li><li data-i18n="governance.simulated_item3"></li></ul>
          </article>
          <article class="governance-card">
            <span class="governance-icon" aria-hidden="true"></span>
            <h3 data-i18n="governance.authority_title"></h3>
            <p data-i18n="governance.authority_body"></p>
            <ul><li data-i18n="governance.authority_item1"></li><li data-i18n="governance.authority_item2"></li><li data-i18n="governance.authority_item3"></li></ul>
          </article>
        </div>
      </section>

      <footer class="footer">
        <span data-i18n="footer.product"></span>
        <span data-i18n="footer.confidential"></span>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
