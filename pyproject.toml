[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-opportunity-resolution-mvp"
version = "0.2.0"
description = "Public-evidence industrial opportunity resolution with an isolated synthetic Ministry demonstration layer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]
e2e = [
  "Pillow==12.3.0",
  "playwright==1.62.0",
  "pytest-playwright==0.9.0"
]

[project.scripts]
ior-demo = "ior_mvp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ior_mvp = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: real-Chromium acceptance tests; excluded from default testpaths",
  "visual: governed visual-regression matrix"
]
