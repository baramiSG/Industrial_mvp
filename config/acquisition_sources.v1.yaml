metadata:
  version: "1.5.0"
  effective_date: "2026-09-13"
  authority: "Methodology §3.2, §11, §11.3; Core 05 v2 §3.2, §4-§6, §10-§11; owner rulings OD-6, OD-9 and S15 OD-7"

raw_store:
  root: data/raw
  compression: gzip
  compresslevel: 9
  mtime: 0
  max_artifact_bytes_compressed: 16777216
  max_store_bytes_compressed: 100663296

offline_guard:
  live_env_var: IOR_ACQUISITION_LIVE
  header_allowlist:
    - content-type
    - content-length
    - last-modified
    - etag
    - date
    - retry-after
  header_denylist:
    - authorization
    - ocp-apim-subscription-key
    - cookie
    - set-cookie
    - proxy-authorization
  user_agent: industrial-opportunity-resolution-mvp/0.2.0 (public-data acquisition; offline runtime)

rate_limit_defaults:
  undocumented_min_interval_seconds: 2.0

sources:
  wits_trade:
    authority: World Bank WITS
    access_classification: public_open
    documentation_reference: https://wits.worldbank.org/wits/wits/witshelp/content/codes/about_api.htm
    terms_reference: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    endpoint_templates:
      UNIVERSE: "https://wits.worldbank.org/trade/comtrade/en/country/SAU/year/{period}/tradeflow/{flow_label}/partner/WLD/product/{product}"
      PARTNERS: "https://wits.worldbank.org/trade/comtrade/en/country/SAU/year/{period}/tradeflow/{flow_label}/partner/ALL/product/{product}"
      TERMS: "https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets"
    parameters:
      product_all_token: Total
      partner_world_token: WLD
      reporter_token: SAU
      flow_tokens:
        imports: Imports
        exports: Exports
    pagination:
      kind: NONE
      documentation_reference: https://wits.worldbank.org/wits/wits/witshelp/content/codes/about_api.htm
      parameters: {}
    nomenclature: H0
    reporter_code: SAU
    credential_env_var: null
    rate_limit:
      documented_policy: UNAVAILABLE
      min_interval_seconds: 2.0
      max_attempts: 3
      timeout_seconds: 60
    license_capture_required: true
    default_evidence_class: B
    default_reviewer_status: unconfirmed_by_responsible_authority
    expected_content_types:
      - text/html
      - application/json
      - text/json
    user_agent: industrial-opportunity-resolution-mvp/0.2.0 (public-data acquisition; offline runtime)
    recorded_on: "2026-09-04"

  un_comtrade:
    authority: UN Comtrade
    access_classification: public_registered
    documentation_reference: https://comtradedeveloper.un.org/api-details#api=comtrade-v1
    terms_reference: https://uncomtrade.org/docs/policy-on-use-and-re-dissemination/
    endpoint_templates:
      UNIVERSE: "https://comtradeapi.un.org/data/v1/get/C/A/HS?reporterCode={reporter}&period={period}&flowCode={flow_code}&cmdCode={product}&partnerCode={partner}&motCode=0&customsCode=C00"
      PARTNERS: "https://comtradeapi.un.org/data/v1/get/C/A/HS?reporterCode={reporter}&period={period}&flowCode={flow_code}&cmdCode={product}&motCode=0&customsCode=C00{partner_dimension_query}"
      TERMS: https://uncomtrade.org/docs/policy-on-use-and-re-dissemination/
    parameters:
      product_all_token: AG6
      partner_world_token: "0"
      reporter_token: "682"
      flow_tokens:
        imports: M
        exports: X
      partner_dimension_variants:
        V1:
          value: ""
          observation_basis: "Null hypothesis: omit partnerCode; behavior must be observed from response rows."
        V2:
          value: "&partner2Code=0"
          observation_basis: "Stored 2024 universe rows contain partner2Code with value 0; usable only if V1 rows show multiple values."
        V3:
          value: "&includeDesc=true"
          observation_basis: "OD-16 owner statement; stored V1 and 2024 universe responses have null description and ISO fields, and repository history used includeDesc. The official v1 parameter table is unobserved here; only V3 response rows establish the effect."
    pagination:
      kind: NONE
      documentation_reference: https://uncomtrade.org/docs/subscriptions/
      parameters: {}
    nomenclature: HS
    reporter_code: SAU
    credential_env_var: IOR_COMTRADE_SUBSCRIPTION_KEY
    credential_header: Ocp-Apim-Subscription-Key
    rate_limit:
      documented_policy: >-
        Basic Individual: "max 100K records per call"; "500 calls/day";
        "5 calls per second". Source:
        https://uncomtrade.org/docs/subscriptions/
      min_interval_seconds: 2.0
      max_attempts: 3
      timeout_seconds: 60
    license_capture_required: true
    default_evidence_class: B
    default_reviewer_status: unconfirmed_by_responsible_authority
    expected_content_types:
      - application/json
    user_agent: industrial-opportunity-resolution-mvp/0.2.0 (public-data acquisition; offline runtime)
    recorded_on: "2026-09-13"

