    hs4_headings: ["3102", "3103", "3104", "3105"]
    status: AVAILABLE
    basis: "Owner confirmation 2026-09-13 (PR-1 default): WCO HS 2022 Chapter 31 headings 31.02, 31.03, 31.04 and 31.05 are the confirmed mineral or chemical fertilisers core. Heading 3101 is the organic-fertiliser boundary excluded by owner scope and remains shown, not hidden. Feedstock headings 2814, 2809, 2510 and 2503 are excluded from the product family. TITLE_VERIFICATION: DOC-WCO-HS-NOMENCLATURE-fe3ed4f5325a-88edcc1ee93d page 2 lines 14, 30, 37 and 42–45; boundary 31.01 page 2 line 10."
