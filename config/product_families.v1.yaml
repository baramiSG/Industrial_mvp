    status: AVAILABLE
    basis: "Owner ruling OD-3 (2026-09-13): WCO HS 2022 Chapter 39 conversion semi-manufactures 39.17 (tubes, pipes and hoses, and fittings therefor, of plastics), 39.20 (other plates, sheets, film, foil and strip, of plastics, non-cellular and not reinforced, laminated, supported or similarly combined with other materials) and 39.21 (other plates, sheets, film, foil and strip, of plastics), matching profile hard gates 'Polymer/additive compatibility; conversion route; tooling; barrier/performance; food, medical or automotive qualification' (methodology §6.3 profile row). 39.02 remains the §14 worked-case primary-forms family. TITLE_VERIFICATION: DOC-WCO-HS-NOMENCLATURE-53d6f01ac062-0926bf9934da page 7 lines 19–20, page 8 lines 8–9 and line 36; index https://www.wcoomd.org/en/topics/nomenclature/instrument-and-tools/hs-nomenclature-2022-edition/hs-nomenclature-2022-edition.aspx."
  pharma_api:
    sector_profile: pharma_api
    hs4_headings: ["2933", "2934", "2935", "2936", "2937", "2939", "2941"]
    status: AVAILABLE
    basis: "Owner confirmation 2026-09-13 (PR-1 default): WCO HS 2022 Chapter 29 headings 29.33, 29.34, 29.35, 29.36, 29.37, 29.39 and 29.41 whose legal titles name pharmaceutically defined molecule classes in the confirmed API-synthesis core. The 3002/3003/3004 biological and finished-dosage boundary is excluded by owner scope and remains shown, not hidden. TITLE_VERIFICATION: DOC-WCO-HS-NOMENCLATURE-fd99902db1af-d01a792902be page 17 line 3, page 18 lines 24 and 40, page 19 lines 5 and 20, page 20 line 12, page 21 line 10; boundary DOC-WCO-HS-NOMENCLATURE-4e3dbeff29ba-7ad8d2b476a9 page 2 line 33 and page 3 lines 13 and 35."
  fertilizers:
