metadata:
  artifact: industrial-opportunity-decision-narratives
  version: "1.3.0"
  effective_date: "2026-09-13"
  authority: "Industrial Opportunity Resolution Methodology §§1.2, 4.2, 5.3, 7.1.1, 7.4, 9, 12 and 15; Core 07 v2"
  status: frozen_for_demo_cycle
  default_locale: en

locales:
  en:
    bcp47: en-US
    direction: ltr
  ar:
    bcp47: ar-SA
    direction: rtl

placeholder_kinds:
  route_code: computed
  trigger: localized
  product_name: localized
  route_label: localized
  route_short_label: localized
  hs_revision: computed
  hs6: computed
  positive_year_count: computed
  confidence_cap: computed
  ratio: computed
  named_fact_count: computed
  partner_detail_reason: computed

templates:
  en:
    decision.public.investigate.headline: "INVESTIGATE — binding constraint unresolved"
    decision.public.investigate.rationale: "Test brownfield first; greenfield is not justified from public evidence."
    decision.public.investigate.condition.no_greenfield: "No greenfield or financial support recommendation before effective capacity and target specification are resolved."
    decision.public.investigate.kill.transitory: "Demand is temporary, re-exported or below efficient scale"
    decision.public.investigate.kill.incumbent_expansion: "Incumbent expansion already closes the specification-adjusted gap"

    decision.public.reject_generic.headline: "REJECT — generic capacity support"
    decision.public.reject_generic.route: "No intervention for generic capacity"
    decision.public.reject_generic.rationale: "Reject generic {product_name} capacity support; investigate only explicitly defined grade/application exceptions."
    decision.public.reject_generic.condition.named_exception: "Only a named specialty grade/application exception may re-enter INVESTIGATE."
    decision.public.reject_generic.kill.equivalence: "Imported and domestic products are shown equivalent and qualified"
    decision.public.reject_generic.kill.no_gap: "No specification-adjusted gap exists"

    decision.public.advance.headline: "ADVANCE — route {route_code}"
    decision.public.advance.rationale: "Evidence supports the selected route and every hard gate is satisfied."
    decision.public.advance.condition: "All evidence, economics, additionality and competition gates must remain satisfied."
    decision.public.advance.kill: "Stop or reroute if any ADVANCE gate ceases to pass."

    decision.public.monitor.headline: "MONITOR — no immediate intervention"
    decision.public.monitor.route: "No intervention; watch the named trigger"
    decision.public.monitor.rationale: "No rejection condition is evidenced; the material trigger is absent."
    decision.public.monitor.condition: "Reassess when {trigger}."

    decision.public.reject_exclusion.headline: "REJECT — hard exclusion satisfied"
    decision.public.reject_exclusion.condition: "Reopen only if evidence shows that the hard exclusion no longer applies."
    decision.public.reject_exclusion.kill: "Stop the proposition while the hard exclusion remains satisfied."
    decision.public.reject_equivalence.headline: "REJECT — equivalent qualified supply"
    decision.public.reject_equivalence.rationale: "Equivalent qualified domestic supply meets or exceeds target demand; capacity intervention is not additional."
    decision.public.reject_equivalence.condition: "Reopen only for a named specification or application that is not equivalently supplied."
    decision.public.reject_equivalence.kill: "Stop capacity support while equivalent qualified supply remains available."

    decision.public.reject_uneconomic.headline: "REJECT — uneconomic at efficient scale"
    decision.public.reject_uneconomic.rationale: "No technically feasible route passes downside economics at minimum efficient scale; capacity support is not justified."
    decision.public.reject_uneconomic.condition: "Reopen only with new downside economics that pass the hurdle rate for a technically feasible route."
    decision.public.reject_uneconomic.kill: "Stop capacity support while every feasible route fails downside economics."
    decision.public.reject_false_gap.headline: "REJECT — false or measurement gap"
    decision.public.reject_false_gap.rationale: "The apparent import gap is a false or measurement gap; it does not evidence unmet domestic demand."
    decision.public.reject_false_gap.condition: "Reopen only if retained-flow evidence shows a real specification-adjusted gap."
    decision.public.reject_false_gap.kill: "Stop the proposition while the gap remains false or unmeasured."
    decision.public.reject_overcapacity.headline: "REJECT — structural overcapacity"
    decision.public.reject_overcapacity.rationale: "The intervention would add unacceptable redundant capacity or crowd out a more efficient incumbent; it is not additional."
    decision.public.reject_overcapacity.condition: "Reopen only if competition evidence shows the added capacity is absorbed without crowding out an efficient incumbent."
    decision.public.reject_overcapacity.kill: "Stop capacity support while structural overcapacity remains evidenced."
    decision.public.investigate.route.unresolved: "Route not yet determined"
    decision.public.investigate.rationale.preferred: "Preferred hypothesis: {route_short_label}; resolve the named evidence before any support decision."
    decision.public.investigate.rationale.route_unresolved: "No route hypothesis can be preferred from public evidence; resolve the named route evidence before any support decision."
    need.route.evidence_required: "Route feasibility, additionality, policy and downside economics evidence for the candidate routes"

    decision.simulated.investigate.headline: "SIMULATED INVESTIGATE — one or more gates remain unresolved"
    decision.simulated.investigate.route: "Simulation controls did not all pass"
    decision.simulated.investigate.rationale: "The simulated branch did not satisfy every hard gate."

    decision.simulated.advance.headline: "SIMULATED ADVANCE — route {route_code}"
    decision.simulated.advance.rationale: "If the displayed Ministry-grade facts are confirmed, the evidence supports the selected route and every hard gate is satisfied."
    decision.simulated.advance.condition: "Confirm every simulated decision-critical fact with Ministry-grade evidence before any public action."
    decision.simulated.advance.kill: "Stop or reroute if any confirmed fact fails an ADVANCE gate."
    decision.simulated.reject.headline: "SIMULATED REJECT — no defensible intervention"
    decision.simulated.reject.rationale: "The simulated evidence satisfies an evidenced rejection condition; capacity support would be non-additional."
    decision.simulated.reject.condition: "Reopen only if confirmed Ministry-grade evidence removes the rejection condition."
    decision.simulated.reject.kill: "Stop any capacity support while the rejection condition remains satisfied."
    decision.simulated.monitor.headline: "SIMULATED MONITOR — no immediate intervention"
    decision.simulated.monitor.route: "No intervention; watch the named trigger"
    decision.simulated.monitor.rationale: "No rejection condition is evidenced in the simulated branch; the material trigger is absent."
    route.reason.partial_resolution: "The route passes its gates but does not fully remove the binding constraint; it does not block higher routes."
    route.reason.feasibility_failed: "The route is not technically feasible on the available evidence."
    route.reason.constraint_class_not_applicable: "The detected binding constraint is outside this route's intervention class."
    route.reason.capability_band_failed: "The published capability distance is outside this route's configured band."
    route.reason.capability_unpublished: "D* is not published, so the route's capability band cannot be tested."

    need.identity.tariff_line: "Saudi tariff-line and invoice description"
    need.specification.line_production: "Line-level production by specification, application and destination"
    need.specification.producer_grade_matrix: "Producer grade, application-equivalence and local-availability matrix"
    need.capacity.availability_allocation: "Effective availability, allocation, utilisation, yield, qualification share, backlog and planned outages"
    need.demand.importer_specification: "Importer/offtaker specifications and reason local supply was not selected"
    need.demand.importer_application_qualification: "Importer/offtaker application and qualification requirements"
    need.flows.reexport_origin_decomposition: "Re-export and domestic-origin flow decomposition"
    need.economics.route_delivered_cost: "Delivered cost, import parity and unsupported {route_label} economics"
    need.economics.named_exception_delivered_cost: "Delivered economics for the named specification/application exception"

    exclusion.heterogeneous_residual: "The commercial product cannot be separated from a highly heterogeneous residual code and no product-level evidence is available."
    exclusion.market_below_mes: "The sustainable downside market is below minimum efficient scale and no credible export contract exists."
    exclusion.unsatisfiable_gate: "A legal, safety, environmental, IP or customer-qualification hard gate cannot be satisfied."
    exclusion.idle_equivalent_capacity: "Domestic production meets the required specification with material idle capacity and no binding market failure is evidenced."
    exclusion.transitory_gap: "The apparent gap is dominated by re-export, one-off project demand, temporary price arbitrage or classification discontinuity."
    exclusion.redundancy: "The intervention would create unacceptable redundant capacity or crowd out a more efficient incumbent."

    monitor.trigger.demand: "verified target-specification demand exceeds effective qualified capacity"
    monitor.trigger.regulation: "a binding regulation changes"
    monitor.trigger.technology: "a required technology becomes available or unavailable"
    monitor.trigger.supplier_concentration: "supplier concentration or disruption exposure materially increases"
    monitor.trigger.capacity_state: "effective qualified capacity falls below target-specification demand"

    route.hypothesis.priority: "{route_short_label} priority to test"
    route.0.short: "No intervention"
    route.1.short: "Barrier removal"
    route.2.short: "Market linkage"
    route.3.short: "Certification support"
    route.4.short: "Demand aggregation"
    route.5.short: "Brownfield"
    route.6.short: "Technology / JV"
    route.7.short: "Targeted greenfield"
    route.8.short: "Shared enabler"

    route.0.label: "No intervention"
    route.1.label: "Remove an administrative, classification or regulatory barrier"
    route.2.label: "Information, market linkage or investor/technology matching"
    route.3.label: "Certification, testing, metrology or quality-system support"
    route.4.label: "Demand aggregation, procurement commitment or conditional offtake"
    route.5.label: "Debottlenecking, yield improvement or incremental line expansion"
    route.6.label: "Technology licensing, specialist line or joint venture"
    route.7.label: "Targeted greenfield entry"
    route.8.label: "Shared enabling infrastructure"

    route.0.reason: "No action is the comparator and is selected when an evidenced rejection condition fully resolves the proposition."
    route.0.reason.monitor: "No immediate action is selected while the named observable trigger is monitored."
    route.1.reason: "Administrative, classification or regulatory barrier evidence is required."
    route.2.reason: "A verified information, linkage or matching constraint is required."
    route.3.reason: "A verified specification, certification, testing or qualification constraint is required."
    route.4.reason: "A verified demand-fragmentation or offtake constraint is required."
    route.5.reason: "Verified incumbent adjacency makes brownfield the priority hypothesis; effective capacity and economics remain required."
    route.6.reason: "A verified technology constraint and major-line/JV adjacency are required."
    route.7.reason: "Greenfield requires failed lower routes, D* above the configured band, demand at MES, and passing competition gates."
    route.8.reason: "GRAPH_REQUIRED: route 8 requires the governed dependency graph and a positive UnlockValue."
    route.reason.input_unavailable: "Required public route evidence is unavailable."
    route.reason.lower_route_resolves: "A lower-intervention route fully resolves the binding constraint."
    route.reason.economics_unavailable: "Downside route economics are unavailable."
    route.reason.economics_failed: "The route does not pass downside economics."
    route.reason.national_value_nonpositive: "The route does not have positive incremental national value."
    route.reason.competition_failed: "The route does not pass the competition control."
    route.reason.additionality_failed: "The intervention is not additional."
    route.reason.policy_failed: "The route is prohibited, disproportionate or unacceptably distortive."
    route.reason.max_nv_selected: "The route has the highest defensible incremental national value after precedence gates."

    gap.false_or_measurement: "False or measurement gap"
    gap.quantity: "Quantity gap"
    gap.specification_or_quality: "Specification or quality gap"
    gap.application: "Application gap"
    gap.timing: "Timing gap"
    gap.resilience: "Resilience gap"
    gap.evidence: "Evidence gap"

    decision.public.no_candidate.headline: "NO CANDIDATE — no candidate signal fired"
    decision.public.no_candidate.route: "No deep-resolution route; screening disposition only"
    decision.public.no_candidate.rationale: "No candidate trigger fired on public evidence; the case is not admitted to deep resolution and no formal state is assigned."
    decision.public.no_candidate.condition: "Re-screen when a candidate signal fires on the public series."

    rule.r0.name: "Identity gate"
    rule.r0.result.identity_frozen: "HS revision {hs_revision} and HS6 {hs6} are frozen in the snapshot; specification/application remains separately gated."
    rule.r0.effect.continue_screening: "Continue to screening while preserving the unresolved decision object."

    rule.r1-f.name: "Persistent retained exposure — full"
    rule.r1-f.result.continuity_unavailable: "Full continuity is unavailable and gross flows are not retained imports."
    rule.r1-f.result.not_fired: "Full persistence test did not fire."
    rule.r1-f.effect.do_not_claim_full_persistence: "Do not claim the full persistence rule."

    rule.r1-d.name: "Persistence signal — degraded"
    rule.r1-d.result.positive_years_observed: "{positive_year_count} positive observed years within the configured window; no interpolation used."
    rule.r1-d.effect.investigate_only_confidence_capped: "Generate INVESTIGATE only; confidence capped at {confidence_cap}."

    rule.r2.name: "Quantity-led expansion"
    rule.r2.result.inputs_unavailable: "Comparable value and quantity observations are unavailable."
    rule.r2.result.fired: "Quantity-led expansion signal fires."
    rule.r2.result.not_quantity_led: "Value movement is not quantity-led under the configured test."
    rule.r2.effect.no_inference: "No inference."
    rule.r2.effect.separate_volume_from_price: "Separate structural volume growth from price movement."

    rule.r3.name: "Supplier concentration"
    rule.r3.result.both_bases_not_calculable: "Value- and quantity-basis partner concentration are NOT_CALCULABLE."
    rule.r3.result.value_concentrated_quantity_not_calculable: "External supply is concentrated on the value basis; quantity concentration is NOT_CALCULABLE."
    rule.r3.result.quantity_concentrated_value_not_calculable: "External supply is concentrated on the quantity basis; value concentration is NOT_CALCULABLE."
    rule.r3.result.concentrated_on_calculable_basis: "External supply is concentrated on at least one calculable basis."
    rule.r3.result.thresholds_not_met: "Concentration thresholds are not met on the calculable basis or bases."
    rule.r3.result.partner_detail_missing: "Partner detail MISSING ({partner_detail_reason}): value- and quantity-basis partner concentration are NOT_CALCULABLE because no partner rows were parsed — missing evidence, not zero trade."
    rule.r3.result.partner_trade_observed_zero: "Partner trade OBSERVED ZERO: value- and quantity-basis partner concentration are NOT_CALCULABLE because zero partner rows were observed."
    rule.r3.effect.no_concentration_inference: "No concentration inference."
    rule.r3.effect.resilience_review: "Generate a resilience/diversification review, not an automatic localisation recommendation."

    rule.r4-f.name: "Product-tier heterogeneity — full"
    rule.r4-f.result.cells_unavailable: "Partner-month × tariff-line cells are unavailable."
    rule.r4-f.effect.no_clusters_or_grades: "Do not fit clusters or claim grades."

    rule.r4-d.name: "Unit-value dispersion — degraded"
    rule.r4-d.result.descriptive_dispersion: "Comparable annual partner unit values show descriptive dispersion; no cluster or grade conclusion."
    rule.r4-d.result.disclosed_dispersion: "A source-attributed annual unit-value dispersion summary supports a descriptive product-mix signal; no cluster or grade conclusion."
    rule.r4-d.result.coverage_insufficient: "Comparable annual partner coverage is insufficient; R4-D is not calculable."
    rule.r4-d.result.partner_detail_missing: "Partner detail MISSING ({partner_detail_reason}): comparable annual partner coverage is unavailable — missing evidence, not zero trade; R4-D is not calculable."
    rule.r4-d.result.partner_trade_observed_zero: "Partner trade OBSERVED ZERO: no partner unit values exist; R4-D is not calculable."
    rule.r4-d.effect.specification_research_only: "Open specification research only; no grade conclusion."

    rule.r5.name: "Domestic supply plus continued imports"
    rule.r5.name.synthetic: "Retained import penetration"
    rule.r5.result.penetration_fired: "Retained import penetration meets the configured mismatch test."
    rule.r5.result.penetration_not_fired: "The configured retained-import penetration test does not fire."
    rule.r5.result.coexistence_fired: "Verified domestic capability coexists with material gross imports."
    rule.r5.result.coexistence_not_met: "Coexistence condition not met."
    rule.r5.result.inputs_unavailable: "Domestic capability or a usable import measure is unavailable."
    rule.r5.result.synthetic_inputs_absent: "Synthetic retained-flow inputs are absent; R5 is not calculable."
    rule.r5.result.synthetic_penetration_fired: "Synthetic retained-import penetration meets the configured R5 threshold."
    rule.r5.result.synthetic_penetration_not_fired: "Synthetic retained-import penetration does not meet the configured R5 threshold."
    rule.r5.effect.test_mismatch_dimensions: "Test specification, qualification, capacity, price, application and allocation mismatch."
    rule.r5.effect.synthetic_declared_blocks_only: "Use only when production and retained-flow blocks are declared."

    rule.r6.name: "Capacity pressure"
    rule.r6.name.synthetic: "Capacity pressure"
    rule.r6.result.not_public: "Effective utilisation and target-specification shortage are not public."
    rule.r6.result.synthetic_pressure_fired: "Synthetic utilisation and shortage proxy meet the configured R6 thresholds; sustained period is NOT_CALCULABLE."
    rule.r6.result.synthetic_pressure_not_fired: "Synthetic R6 utilisation/shortage proxy does not meet both configured thresholds; sustained period is NOT_CALCULABLE."
    rule.r6.result.synthetic_inputs_unavailable: "Synthetic utilisation or effective qualified capacity is unavailable; R6 is not calculable."
    rule.r6.effect.obtain_line_level_inputs: "Obtain line-level availability, yield, qualification share and allocation."
    rule.r6.effect.synthetic_degraded_signal_only: "Use as a DEGRADED capacity-pressure signal only; it cannot by itself support ADVANCE without a sustained period."

    rule.r7.name: "Latent domestic capacity"
    rule.r7.name.synthetic: "Latent domestic capacity"
    rule.r7.result.not_established_publicly: "Idle qualified capacity and specification equivalence are not established publicly."
    rule.r7.result.synthetic_latent_fired: "Synthetic utilisation and specification equivalence meet the configured latent-capacity test."
    rule.r7.result.synthetic_latent_not_fired: "Synthetic utilisation/equivalence does not meet the configured latent-capacity test."
    rule.r7.result.synthetic_latent_not_calculable: "Synthetic latent capacity is not calculable because a required utilisation or equivalence input is absent."
    rule.r7.effect.do_not_assume_latent_capacity: "Do not assume latent capacity."
    rule.r7.effect.synthetic_test_routes_when_established: "Test no-support, market linkage, procurement, or barrier removal only when equivalence and latent capacity are established."

    rule.r8.name: "Committed future demand"
    rule.r8.name.synthetic: "Committed future demand"
    rule.r8.result.committed_demand_unavailable: "Awarded/financed demand at the target specification is unavailable."
    rule.r8.result.synthetic_layers_disclosed: "Committed and announced layers are disclosed, but base demand, commitment probability, and minimum efficient scale govern R8 calculability."
    rule.r8.effect.keep_demand_layers_separate: "Keep base, committed and announced demand separate when provided."
    rule.r8.effect.synthetic_do_not_infer_addition: "Do not infer probability-adjusted demand addition or MES fill; keep committed and announced demand separate."

    rule.r9-s.name: "Coarse incumbent adjacency screen"
    rule.r9-s.result.adjacent_plant_with_signals: "A verified Saudi plant is in the same process family with additional capability signals."
    rule.r9-s.result.no_defensible_signal: "No defensible coarse adjacency signal."
    rule.r9-s.effect.open_line_level_assessment: "Open the full line-level capability assessment; do not publish D* from screening alone."

    rule.r10.name: "Strategic criticality"
    rule.r10.result.designated: "A responsible-authority criticality designation is present."
    rule.r10.result.resilience_review_warranted: "A resilience review is warranted by concentration; formal criticality still requires authority confirmation."
    rule.r10.result.no_designation: "No responsible-authority criticality designation is present in the demo snapshot."
    rule.r10.effect.separate_viability_from_strategy: "Keep commercial viability and strategic value separate."

    rule.r11.name: "Economic exclusion / generic-capacity warning"
    rule.r11.result.generic_capacity_fired: "Gross exports are {ratio}× imports; generic new capacity cannot be justified from HS6 imports alone."
    rule.r11.result.warning_threshold_not_met: "Gross exports are {ratio}× imports; the configured generic-capacity warning threshold is not met."
    rule.r11.result.not_calculable: "Export/import ratio or established nameplate capability is NOT_CALCULABLE; no generic-capacity exclusion fires."
    rule.r11.effect.reject_generic_or_named_exception: "Reject generic support or move only a named specialty exception to investigation."

    rule.r12.name: "Evidence-value trigger"
    rule.r12.result.named_facts_could_change_route: "{named_fact_count} named facts could change the route."
    rule.r12.effect.prioritise_smallest_request: "Prioritise the smallest evidence request with a plausible route effect; quantify EVSI when cost and value inputs exist."

  ar:
    decision.public.investigate.headline: "تحقّق — القيد الملزم غير محسوم"
    decision.public.investigate.rationale: "اختبر المسار القائم أولاً؛ فلا تبرر الأدلة العامة إنشاء مشروع جديد مستقل."
    decision.public.investigate.condition.no_greenfield: "لا توصية بمشروع جديد أو دعم مالي قبل حسم الطاقة الفعلية والمواصفة المستهدفة."
    decision.public.investigate.kill.transitory: "الطلب مؤقت أو معاد التصدير أو دون الحد الأدنى للكفاءة"
    decision.public.investigate.kill.incumbent_expansion: "توسّع منتج قائم يسد بالفعل الفجوة المعدلة بالمواصفة"

    decision.public.reject_generic.headline: "رفض — دعم الطاقة الإنتاجية العامة"
    decision.public.reject_generic.route: "لا تدخل لدعم طاقة إنتاجية عامة"
    decision.public.reject_generic.rationale: "ارفض دعم طاقة إنتاج {product_name} العامة؛ ولا تتحقق إلا من استثناءات محددة بوضوح للدرجة أو التطبيق."
    decision.public.reject_generic.condition.named_exception: "لا تعاد الحالة إلى التحقق إلا لاستثناء مسمى لدرجة متخصصة أو تطبيق مدعوم بدليل."
    decision.public.reject_generic.kill.equivalence: "ثبت تكافؤ المنتجات المستوردة والمحلية وتأهيلها"
    decision.public.reject_generic.kill.no_gap: "لا توجد فجوة معدلة بالمواصفة"

    decision.public.advance.headline: "تقدّم — المسار {route_code}"
    decision.public.advance.rationale: "تدعم الأدلة المسار المختار، وجميع البوابات الصلبة مستوفاة."
    decision.public.advance.condition: "يجب أن تبقى بوابات الأدلة والاقتصاديات والإضافية والمنافسة مستوفاة."
    decision.public.advance.kill: "أوقف المسار أو غيّره إذا لم تعد أي بوابة من بوابات التقدّم مستوفاة."

    decision.public.monitor.headline: "راقب — لا تدخل فوري"
    decision.public.monitor.route: "لا تدخل؛ راقب المحفّز المسمى"
    decision.public.monitor.rationale: "لم يثبت شرط رفض، والمحفّز المادي غير متحقق."
    decision.public.monitor.condition: "أعد التقييم عندما {trigger}."

    decision.public.reject_exclusion.headline: "رفض — تحقق استبعاد صلب"
    decision.public.reject_exclusion.condition: "لا تُفتح الحالة مجدداً إلا إذا أثبتت الأدلة أن الاستبعاد الصلب لم يعد منطبقاً."
    decision.public.reject_exclusion.kill: "أوقف المقترح ما دام الاستبعاد الصلب متحققاً."
    decision.public.reject_equivalence.headline: "رفض — عرض مؤهل مكافئ"
    decision.public.reject_equivalence.rationale: "يلبي العرض المحلي المؤهل المكافئ الطلب المستهدف أو يتجاوزه؛ ولذلك لا يحقق تدخل الطاقة إضافية."
    decision.public.reject_equivalence.condition: "لا تُفتح الحالة مجدداً إلا لمواصفة أو تطبيق مسمى لا يتوافر له عرض مكافئ."
    decision.public.reject_equivalence.kill: "أوقف دعم الطاقة ما دام العرض المؤهل المكافئ متاحاً."

    decision.public.reject_uneconomic.headline: "رفض — غير اقتصادي عند الحد الأدنى للكفاءة"
    decision.public.reject_uneconomic.rationale: "لا يجتاز أي مسار مجدٍ تقنياً الاقتصاديات في السيناريو المتحفظ عند الحد الأدنى للكفاءة؛ ولذلك لا يُبرر دعم الطاقة الإنتاجية."
    decision.public.reject_uneconomic.condition: "لا تُفتح الحالة مجدداً إلا باقتصاديات جديدة للسيناريو المتحفظ تجتاز معدل العائد المطلوب لمسار مجدٍ تقنياً."
    decision.public.reject_uneconomic.kill: "أوقف دعم الطاقة الإنتاجية ما دام كل مسار مجدٍ يفشل في اقتصاديات السيناريو المتحفظ."
    decision.public.reject_false_gap.headline: "رفض — فجوة زائفة أو ناتجة عن القياس"
